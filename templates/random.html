<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gacha Recipe System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎰 Gacha Recipe System</h1>

    <!-- GACHA IMAGE -->
    <img class="gacha-img" src="https://png.pngtree.com/png-clipart/20201208/original/pngtree-realistic-blue-gacha-machine-illustration-isolated-vector-png-image_5594671.jpg">

    <div class="machine-box">

        <div id="result">
            Click spin to get your recipe 🍽️
        </div>

        <button onclick="spin()">SPIN 🎲</button>

    </div>

</div>

<script>
function spin() {

    let resultBox = document.getElementById("result");
    let button = document.querySelector("button");

    // 1. disable button (防 spam click)
    button.disabled = true;

    // 2. show loading text
    resultBox.innerText = "🎰 Spinning...";

    // 3. fake delay (gacha feel)
    setTimeout(() => {

        fetch('/random')
        .then(response => response.json())
        .then(data => {

            // 4. DOM update result
            resultBox.innerText = "🎁 You got: " + data.recipe;

            // 5. re-enable button
            button.disabled = false;

        })
        .catch(error => {
            console.error(error);
            resultBox.innerText = "Error!";
            button.disabled = false;
        });

    }, 1000); // 1 second delay
}
</script>

</body>
</html>
