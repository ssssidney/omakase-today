<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gacha Recipe System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎰 Gacha Recipe System</h1>

    <!-- GACHA IMAGE -->
    <img class="gacha-img" src="https://png.pngtree.com/png-clipart/20201208/original/pngtree-realistic-blue-gacha-machine-illustration-isolated-vector-png-image_5594671.jpg">

    <div class="machine-box">

        <div id="result">
            Click spin to get your recipe 🍽️
        </div>

        <button onclick="spin()">SPIN 🎲</button>

    </div>

</div>

<script>
function spin() {

    fetch('/random')
    .then(response => response.json())
    .then(data => {

        document.getElementById("result").innerText =
            "🎁 You got: " + data.recipe;

    })
    .catch(error => {
        console.error('Error:', error);
    });

}
</script>

</body>
</html>
